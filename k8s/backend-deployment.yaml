apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: spintelligence-dsm
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: backend
          # Jenkins overwrites this tag on every deploy via `kubectl set image`.
          image: ghcr.io/qbic-catalyst-partners/spintelligence_dsm-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-env
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
