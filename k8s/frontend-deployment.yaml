apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: spintelligence-dsm
  labels:
    app: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: frontend
          # Jenkins overwrites this tag on every deploy via `kubectl set image`.
          # NEXT_PUBLIC_API_URL is baked in at image build time (Next.js standalone),
          # not set here — see the Jenkinsfile build stage.
          image: ghcr.io/qbic-catalyst-partners/spintelligence_dsm-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
